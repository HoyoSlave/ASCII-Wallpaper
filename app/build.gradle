plugins {
    id 'com.android.application'
}

android {
    namespace 'com.asciiwallpaper.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.asciiwallpaper.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.1"
    }

    signingConfigs {
        release {
            def keystoreFile = file("release-key.jks")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android123"
                keyAlias System.getenv("KEY_ALIAS") ?: "asciiwallpaper"
                keyPassword System.getenv("KEY_PASSWORD") ?: "android123"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (file("release-key.jks").exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Pure stock Android SDK only (zero external UI customization libraries)
}
